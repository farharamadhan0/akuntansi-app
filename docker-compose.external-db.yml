version: '3.8'

# Docker Compose dengan database di localhost (bukan container)
# Usage: docker compose -f docker-compose.external-db.yml up -d
#
# CATATAN PENTING untuk PostgreSQL di localhost:
# 1. Edit postgresql.conf: listen_addresses = '*'
# 2. Edit pg_hba.conf: tambah baris:
#    host    all             all             172.0.0.0/8             scram-sha-256
# 3. Restart PostgreSQL: sudo systemctl restart postgresql
# 4. Pastikan firewall membuka port 5432 untuk Docker network

services:
  app:
    network_mode: host
    build:
      context: .
      dockerfile: Dockerfile
    container_name: akuntansi-app
    restart: unless-stopped
    # Atau pakai network_mode host (tidak bisa pakai port mapping):
    # network_mode: host
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      # Gunakan host.docker.internal untuk akses host machine
      # Untuk Linux VPS, ganti dengan IP publik VPS atau 172.17.0.1 (docker0 IP)
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-akuntansi}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
    volumes:
      - ./storage:/var/www/storage
      - ./bootstrap/cache:/var/www/bootstrap/cache

  # Queue Worker
  queue:
    network_mode: host
    build:
      context: .
      dockerfile: Dockerfile
    container_name: akuntansi-queue
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: database
    volumes:
      - ./storage:/var/www/storage

  # Scheduler
  scheduler:
    network_mode: host
    build:
      context: .
      dockerfile: Dockerfile
    container_name: akuntansi-scheduler
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./storage:/var/www/storage